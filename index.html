<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Tic-Tac-Toe / دوز </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Vazir', Tahoma, sans-serif;
            background: radial-gradient(ellipse at center, #1a1a2e, #0f0f1a);
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 35px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            text-shadow: 0 2px 20px rgba(100, 100, 255, 0.3);
        }

        .title .icon {
            font-size: 30px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .lang-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .lang-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .mode-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            transform: scale(1.02);
        }

        .mode-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.05);
        }

        .turn-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .turn-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            font-weight: 600;
        }

        .turn-player {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .turn-player .badge {
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 14px;
        }

        .badge.x-badge { background: rgba(231, 76, 60, 0.3); color: #e74c3c; }
        .badge.o-badge { background: rgba(52, 152, 219, 0.3); color: #3498db; }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 24px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.05);
            min-height: 100px;
        }

        .cell:hover:not(.taken):not(.game-over) {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .cell.taken, .cell.game-over {
            cursor: not-allowed;
        }

        .cell.x {
            color: #e74c3c;
            text-shadow: 0 0 40px rgba(231, 76, 60, 0.3);
        }

        .cell.o {
            color: #3498db;
            text-shadow: 0 0 40px rgba(52, 152, 219, 0.3);
        }

        .cell.winner {
            background: rgba(46, 204, 113, 0.25) !important;
            border-color: #2ecc71 !important;
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 50px rgba(46, 204, 113, 0.15);
            transform: scale(1.05);
        }

        .cell.winner.x { color: #2ecc71; text-shadow: 0 0 60px rgba(46, 204, 113, 0.4); }
        .cell.winner.o { color: #2ecc71; text-shadow: 0 0 60px rgba(46, 204, 113, 0.4); }

        @keyframes pop {
            0% { transform: scale(0.7); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1.05); }
        }

        .status {
            padding: 14px 18px;
            border-radius: 16px;
            margin: 12px 0;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s;
        }

        .status.win {
            background: rgba(46, 204, 113, 0.15);
            border-color: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }

        .status.draw {
            background: rgba(241, 196, 15, 0.15);
            border-color: rgba(241, 196, 15, 0.3);
            color: #f1c40f;
        }

        .status.turn {
            color: rgba(255, 255, 255, 0.8);
        }

        .score-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }

        .score-section.active {
            display: block;
        }

        .score-title {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .score {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .score-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
        }

        .score-item .num {
            font-size: 20px;
            min-width: 24px;
            text-align: center;
        }

        .score-item.x-score .num { color: #e74c3c; }
        .score-item.o-score .num { color: #3498db; }
        .score-item.draw-score .num { color: #f1c40f; }
        .score-item.points .num { color: #2ecc71; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 35px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95) !important;
        }

        .robot-thinking {
            opacity: 0.5;
            pointer-events: none;
        }

        @media (max-width: 500px) {
            .game-container { padding: 20px; }
            .title h1 { font-size: 20px; }
            .cell { font-size: 44px; min-height: 70px; }
            .board { gap: 8px; padding: 8px; }
            .score-item { font-size: 13px; padding: 6px 12px; }
            .turn-player { font-size: 16px; }
            .mode-btn { font-size: 12px; padding: 8px 10px; }
            .btn { font-size: 13px; padding: 12px 14px; }
            .score { gap: 8px; }
        }

        @media (max-width: 380px) {
            .cell { font-size: 34px; min-height: 55px; }
            .game-container { padding: 14px; }
            .header { flex-direction: column; gap: 8px; }
            .lang-toggle { align-self: stretch; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="game-container">
    <!-- HEADER -->
    <div class="header">
        <div class="title">
            <span class="icon">🎮</span>
            <h1 id="mainTitle">دوز</h1>
        </div>
        <button class="lang-toggle" id="langToggle">🇬🇧 English</button>
    </div>

    <!-- MODE SELECTOR -->
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="2player" id="mode2p">👥 ۲ نفره</button>
        <button class="mode-btn" data-mode="robot" id="modeRobot">🤖 با ربات</button>
    </div>

    <!-- TURN INDICATOR -->
    <div class="turn-indicator">
        <span class="turn-text" id="turnLabel">نوبت:</span>
        <div class="turn-player">
            <span id="turnSymbol">❌</span>
            <span class="badge x-badge" id="turnBadge">بازیکن ۱</span>
        </div>
    </div>

    <!-- BOARD -->
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <!-- STATUS -->
    <div class="status turn" id="status">نوبت بازیکن ۱ (❌)</div>

    <!-- SCORE 2-PLAYER -->
    <div class="score-section active" id="score2p">
        <div class="score-title">🔒 👥 امتیازات دو نفره</div>
        <div class="score">
            <div class="score-item x-score">❌ برد <span class="num" id="xScore2p">0</span></div>
            <div class="score-item draw-score">🤝 مساوی <span class="num" id="drawScore2p">0</span></div>
            <div class="score-item o-score">⭕ باخت <span class="num" id="oScore2p">0</span></div>
            <div class="score-item points">⭐ امتیاز شما <span class="num" id="points2p">0</span></div>
        </div>
    </div>

    <!-- SCORE ROBOT -->
    <div class="score-section" id="scoreRobot">
        <div class="score-title">🔒 🤖 امتیازات با ربات</div>
        <div class="score">
            <div class="score-item x-score">❌ برد <span class="num" id="xScoreRobot">0</span></div>
            <div class="score-item draw-score">🤝 مساوی <span class="num" id="drawScoreRobot">0</span></div>
            <div class="score-item o-score">⭕ باخت <span class="num" id="oScoreRobot">0</span></div>
            <div class="score-item points">⭐ امتیاز شما <span class="num" id="pointsRobot">0</span></div>
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
        <button class="btn btn-primary" id="resetBtn">🔄 <span id="resetLabel">بازی جدید</span></button>
    </div>
</div>

<script>
    // ============================================================
    //  LANGUAGE DATA
    // ============================================================
    const LANG = {
        fa: {
            title: 'دوز',
            turn: 'نوبت:',
            player1: 'بازیکن ۱',
            player2: 'بازیکن ۲',
            you: 'شما',
            robot: 'ربات',
            win: '🎉 برنده شد:',
            draw: '🤝 مساوی!',
            turnP1: 'نوبت بازیکن ۱ (❌)',
            turnP2: 'نوبت بازیکن ۲ (⭕)',
            turnYou: 'نوبت شما (❌)',
            turnRobot: 'نوبت ربات (⭕)',
            reset: 'بازی جدید',
            mode2p: '👥 ۲ نفره',
            modeRobot: '🤖 با ربات',
            langLabel: '🇬🇧 English',
            robotWin: '🤖 ربات برنده شد!',
            youWin: '🎉 شما برنده شدید!'
        },
        en: {
            title: 'Tic-Tac-Toe',
            turn: 'Turn:',
            player1: 'Player 1',
            player2: 'Player 2',
            you: 'You',
            robot: 'Robot',
            win: '🎉 Winner:',
            draw: '🤝 Draw!',
            turnP1: "Player 1's turn (❌)",
            turnP2: "Player 2's turn (⭕)",
            turnYou: "Your turn (❌)",
            turnRobot: "Robot's turn (⭕)",
            reset: 'New Game',
            mode2p: '👥 2 Players',
            modeRobot: '🤖 vs Robot',
            langLabel: '🇮🇷 فارسی',
            robotWin: '🤖 Robot won!',
            youWin: '🎉 You won!'
        }
    };

    // ===== STATE =====
    let lang = 'fa';
    let gameMode = '2player';
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;
    let isRobotThinking = false;
    let gameOverFlag = false;

    // امتیازات جداگانه
    let scores2p = { X: 0, O: 0, draw: 0, pointsX: 0 };
    let scoresRobot = { X: 0, O: 0, draw: 0, pointsX: 0 };

    const STORAGE_KEY = 'tictactoe_permanent_v3';

    // ===== DOM REFS =====
    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const turnSymbol = document.getElementById('turnSymbol');
    const turnBadge = document.getElementById('turnBadge');
    const turnLabel = document.getElementById('turnLabel');
    const resetBtn = document.getElementById('resetBtn');
    const langToggle = document.getElementById('langToggle');
    const mode2p = document.getElementById('mode2p');
    const modeRobot = document.getElementById('modeRobot');
    const mainTitle = document.getElementById('mainTitle');
    const resetLabel = document.getElementById('resetLabel');

    // المان‌های امتیازات
    const score2pSection = document.getElementById('score2p');
    const scoreRobotSection = document.getElementById('scoreRobot');
    
    const xScore2p = document.getElementById('xScore2p');
    const oScore2p = document.getElementById('oScore2p');
    const drawScore2p = document.getElementById('drawScore2p');
    const points2p = document.getElementById('points2p');

    const xScoreRobot = document.getElementById('xScoreRobot');
    const oScoreRobot = document.getElementById('oScoreRobot');
    const drawScoreRobot = document.getElementById('drawScoreRobot');
    const pointsRobot = document.getElementById('pointsRobot');

    const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    // ============================================================
    //  LOCALSTORAGE - دائمی
    // ============================================================
    function saveGame() {
        const data = {
            lang, gameMode, board, currentPlayer, gameActive, gameOverFlag,
            scores2p, scoresRobot
        };
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}
    }

    function loadGame() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const data = JSON.parse(raw);
            lang = data.lang || 'fa';
            gameMode = data.gameMode || '2player';
            board = data.board || ['', '', '', '', '', '', '', '', ''];
            currentPlayer = data.currentPlayer || 'X';
            gameActive = data.gameActive !== undefined ? data.gameActive : true;
            gameOverFlag = data.gameOverFlag || false;
            scores2p = data.scores2p || { X: 0, O: 0, draw: 0, pointsX: 0 };
            scoresRobot = data.scoresRobot || { X: 0, O: 0, draw: 0, pointsX: 0 };
            return true;
        } catch (e) { return false; }
    }

    // ============================================================
    //  LANGUAGE
    // ============================================================
    function t(key) {
        return LANG[lang][key] || key;
    }

    function updateLanguage() {
        mainTitle.textContent = t('title');
        turnLabel.textContent = t('turn');
        langToggle.textContent = t('langLabel');
        resetLabel.textContent = t('reset');
        mode2p.textContent = t('mode2p');
        modeRobot.textContent = t('modeRobot');
        updateUI();
        saveGame();
    }

    langToggle.addEventListener('click', () => {
        lang = lang === 'fa' ? 'en' : 'fa';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
        updateLanguage();
    });

    // ============================================================
    //  MODE - نمایش امتیازات مربوطه
    // ============================================================
    function updateScoreVisibility() {
        if (gameMode === '2player') {
            score2pSection.classList.add('active');
            scoreRobotSection.classList.remove('active');
        } else {
            score2pSection.classList.remove('active');
            scoreRobotSection.classList.add('active');
        }
    }

    [mode2p, modeRobot].forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameMode = btn.dataset.mode;
            updateScoreVisibility();
            resetGame();
            saveGame();
        });
    });

    // ============================================================
    //  GAME LOGIC
    // ============================================================
    cells.forEach(cell => {
        cell.addEventListener('click', () => {
            const index = parseInt(cell.dataset.index);
            handleCellClick(index);
        });
    });

    function handleCellClick(index) {
        if (!gameActive || gameOverFlag) return;
        if (board[index] !== '') return;
        if (gameMode === 'robot' && currentPlayer === 'O' && !isRobotThinking) return;
        if (isRobotThinking) return;

        makeMove(index);
        saveGame();

        if (gameMode === 'robot' && gameActive && !gameOverFlag && currentPlayer === 'O') {
            isRobotThinking = true;
            document.querySelector('.board').classList.add('robot-thinking');
            setTimeout(() => {
                robotMove();
                isRobotThinking = false;
                document.querySelector('.board').classList.remove('robot-thinking');
                saveGame();
            }, 500);
        }
    }

    function makeMove(index) {
        board[index] = currentPlayer;
        const cell = cells[index];
        cell.textContent = currentPlayer === 'X' ? '❌' : '⭕';
        cell.classList.add('taken', currentPlayer.toLowerCase());

        if (checkWin(currentPlayer)) {
            endGame(currentPlayer);
            return;
        }

        if (board.every(cell => cell !== '')) {
            endGame('draw');
            return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateUI();
    }

    function checkWin(player) {
        let won = false;
        winPatterns.forEach(pattern => {
            if (pattern.every(idx => board[idx] === player)) {
                pattern.forEach(idx => cells[idx].classList.add('winner'));
                won = true;
            }
        });
        return won;
    }

    function endGame(winner) {
        gameActive = false;
        gameOverFlag = true;
        
        if (gameMode === '2player') {
            if (winner === 'draw') {
                scores2p.draw++;
                scores2p.pointsX += 1;
                statusEl.className = 'status draw';
                statusEl.textContent = t('draw');
            } else if (winner === 'X') {
                scores2p.X++;
                scores2p.pointsX += 3;
                statusEl.className = 'status win';
                statusEl.textContent = `${t('win')} ${t('player1')}`;
            } else {
                scores2p.O++;
                statusEl.className = 'status win';
                statusEl.textContent = `${t('win')} ${t('player2')}`;
            }
        } else {
            if (winner === 'draw') {
                scoresRobot.draw++;
                scoresRobot.pointsX += 1;
                statusEl.className = 'status draw';
                statusEl.textContent = t('draw');
            } else if (winner === 'X') {
                scoresRobot.X++;
                scoresRobot.pointsX += 3;
                statusEl.className = 'status win';
                statusEl.textContent = t('youWin');
            } else {
                scoresRobot.O++;
                statusEl.className = 'status win';
                statusEl.textContent = t('robotWin');
            }
        }
        
        updateScore();
        updateUI();
        cells.forEach(c => c.classList.add('game-over'));
        saveGame();
    }

    function updateUI() {
        const player = currentPlayer;
        const symbol = player === 'X' ? '❌' : '⭕';
        turnSymbol.textContent = symbol;

        if (gameOverFlag) {
            turnBadge.textContent = statusEl.textContent.includes('Draw') || statusEl.textContent.includes('مساوی') ? '🤝' : '🏆';
            turnBadge.className = 'badge';
            return;
        }

        if (gameMode === '2player') {
            const name = player === 'X' ? t('player1') : t('player2');
            turnBadge.textContent = `${name} (${symbol})`;
            turnBadge.className = `badge ${player === 'X' ? 'x-badge' : 'o-badge'}`;
            statusEl.className = 'status turn';
            statusEl.textContent = player === 'X' ? t('turnP1') : t('turnP2');
        } else {
            if (player === 'X') {
                turnBadge.textContent = `${t('you')} (❌)`;
                turnBadge.className = 'badge x-badge';
                statusEl.className = 'status turn';
                statusEl.textContent = t('turnYou');
            } else {
                turnBadge.textContent = `${t('robot')} (⭕)`;
                turnBadge.className = 'badge o-badge';
                statusEl.className = 'status turn';
                statusEl.textContent = t('turnRobot');
            }
        }
    }

    function updateScore() {
        xScore2p.textContent = scores2p.X;
        oScore2p.textContent = scores2p.O;
        drawScore2p.textContent = scores2p.draw;
        points2p.textContent = scores2p.pointsX;

        xScoreRobot.textContent = scoresRobot.X;
        oScoreRobot.textContent = scoresRobot.O;
        drawScoreRobot.textContent = scoresRobot.draw;
        pointsRobot.textContent = scoresRobot.pointsX;
    }

    // ============================================================
    //  MINIMAX - ربات شکست‌ناپذیر
    // ============================================================
    function minimax(board, depth, isMaximizing) {
        if (checkWinMini('O')) return 10 - depth;
        if (checkWinMini('X')) return depth - 10;
        if (board.every(c => c !== '')) return 0;

        if (isMaximizing) {
            let best = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    best = Math.max(best, minimax(board, depth + 1, false));
                    board[i] = '';
                }
            }
            return best;
        } else {
            let best = Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'X';
                    best = Math.min(best, minimax(board, depth + 1, true));
                    board[i] = '';
                }
            }
            return best;
        }
    }

    function checkWinMini(player) {
        return winPatterns.some(pattern => pattern.every(idx => board[idx] === player));
    }

    function robotMove() {
        if (!gameActive || gameOverFlag) return;
        if (currentPlayer !== 'O') return;
        if (board.every(cell => cell !== '')) return;

        let bestScore = -Infinity;
        let bestMove = -1;

        if (board.every(c => c === '')) {
            makeMove(4);
            return;
        }

        for (let i = 0; i < 9; i++) {
            if (board[i] === '') {
                board[i] = 'O';
                let score = minimax(board, 0, false);
                board[i] = '';
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
        }

        if (bestMove !== -1) {
            makeMove(bestMove);
        }
    }

    // ============================================================
    //  RESET
    // ============================================================
    function resetGame() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        gameOverFlag = false;
        isRobotThinking = false;

        cells.forEach(cell => {
            cell.textContent = '';
            cell.className = 'cell';
        });

        statusEl.className = 'status turn';
        updateUI();
        saveGame();
    }

    resetBtn.addEventListener('click', resetGame);

    // ============================================================
    //  RESTORE BOARD FROM SAVE
    // ============================================================
    function restoreBoard() {
        cells.forEach((cell, idx) => {
            const val = board[idx];
            if (val === 'X') {
                cell.textContent = '❌';
                cell.classList.add('taken', 'x');
            } else if (val === 'O') {
                cell.textContent = '⭕';
                cell.classList.add('taken', 'o');
            } else {
                cell.textContent = '';
                cell.className = 'cell';
            }
        });

        if (gameOverFlag) {
            cells.forEach(c => c.classList.add('game-over'));
            ['X', 'O'].forEach(player => {
                winPatterns.forEach(pattern => {
                    if (pattern.every(idx => board[idx] === player)) {
                        pattern.forEach(idx => cells[idx].classList.add('winner'));
                    }
                });
            });
            if (statusEl.textContent.includes('Draw') || statusEl.textContent.includes('مساوی')) {
                statusEl.className = 'status draw';
            } else {
                statusEl.className = 'status win';
            }
        } else {
            statusEl.className = 'status turn';
        }
        updateUI();
        updateScore();
        updateScoreVisibility();
    }

    // ============================================================
    //  INIT
    // ============================================================
    function init() {
        const loaded = loadGame();
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === gameMode);
        });

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';

        if (loaded) {
            restoreBoard();
        } else {
            resetGame();
        }
        
        updateLanguage();
        updateScoreVisibility();
    }

    init();
</script>
</body>
</html>
