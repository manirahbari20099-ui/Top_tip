name: Create DOZ Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    env:
      # ==========================================
      # فقط این رمز را با رمز خودت عوض کن
      # ==========================================
      KEYSTORE_PASSWORD: "Mani_3840494915_Mani"

    steps:

      # ==========================================
      # Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # Create Keystore
      # ==========================================
      - name: Create DOZ Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore doz-release.keystore \
            -alias doz \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=DOZ, OU=Game, O=DOZ, L=Game, ST=Game, C=XX"

          echo "======================================"
          echo "DOZ KEYSTORE CREATED"
          echo "======================================"
          echo "Alias: doz"
          echo "Keystore: doz-release.keystore"
          echo "======================================"

      # ==========================================
      # Convert Keystore to Base64
      # ==========================================
      - name: Convert Keystore to Base64
        run: |
          BASE64_KEYSTORE=$(base64 -w 0 doz-release.keystore)

          echo "======================================"
          echo "ANDROID_KEYSTORE_BASE64"
          echo "======================================"
          echo "$BASE64_KEYSTORE"
          echo
          echo "======================================"
          echo "ANDROID_KEY_ALIAS"
          echo "======================================"
          echo "doz"
          echo
          echo "======================================"
          echo "ANDROID_KEYSTORE_PASSWORD"
          echo "======================================"
          echo "$KEYSTORE_PASSWORD"
          echo
          echo "======================================"
          echo "ANDROID_KEY_PASSWORD"
          echo "======================================"
          echo "$KEYSTORE_PASSWORD"
          echo
          echo "======================================"
          echo "IMPORTANT"
          echo "======================================"
          echo "Save the Base64 value and password securely."
          echo "Do NOT publish them anywhere."
