name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Tic-Tac-Toe Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create web directory
        run: |
          mkdir -p www

          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "public/index.html" ]; then
            cp public/index.html www/index.html
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi

      - name: Create app package
        run: |
          cat > package.json <<'EOF'
          {
            "name": "tic-tac-toe-android",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tictactoe.game",
            "appName": "Tic Tac Toe",
            "webDir": "www"
          }
          EOF

      - name: Generate Android icon
        run: |
          mkdir -p icon

          python3 - <<'PY'
          from PIL import Image, ImageDraw

          size = 1024

          img = Image.new("RGBA", (size, size), (20, 20, 45, 255))
          draw = ImageDraw.Draw(img)

          margin = 120
          cell = (size - margin * 2) // 3

          for i in range(1, 3):
              x = margin + i * cell
              y = margin + i * cell

              draw.line(
                  [(x, margin), (x, size - margin)],
                  fill=(102, 126, 234, 255),
                  width=35
              )

              draw.line(
                  [(margin, y), (size - margin, y)],
                  fill=(102, 126, 234, 255),
                  width=35
              )

          x1 = margin + 45
          y1 = margin + 45
          x2 = margin + cell - 45
          y2 = margin + cell - 45

          draw.line(
              [(x1, y1), (x2, y2)],
              fill=(231, 76, 60, 255),
              width=45
          )

          draw.line(
              [(x2, y1), (x1, y2)],
              fill=(231, 76, 60, 255),
              width=45
          )

          cx = margin + cell + cell // 2
          cy = margin + cell + cell // 2
          radius = cell // 3

          draw.ellipse(
              [
                  cx - radius,
                  cy - radius,
                  cx + radius,
                  cy + radius
              ],
              outline=(52, 152, 219, 255),
              width=45
          )

          img.save("icon/icon.png")
          PY

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Create Android icon resources
        run: |
          ICON="icon/icon.png"

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp "$ICON" android/app/src/main/res/drawable/icon.png

          python3 - <<'PY'
          from PIL import Image

          source = Image.open("icon/icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(f"android/app/src/main/res/{folder}/ic_launcher.png")
              icon.save(f"android/app/src/main/res/{folder}/ic_launcher_round.png")
          PY

      - name: Sync web app to Android
        run: |
          npx cap sync android

      - name: Set Android build permissions
        run: |
          chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/Tic-Tac-Toe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Tic-Tac-Toe-Android-APK
          path: output/Tic-Tac-Toe.apk
          if-no-files-found: error
          retention-days: 30
