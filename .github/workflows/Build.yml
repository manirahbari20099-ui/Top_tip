name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare web files
        run: |
          mkdir -p www

          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "public/index.html" ]; then
            cp public/index.html www/index.html
          else
            echo "ERROR: index.html not found!"
            exit 1
          fi

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "tic-tac-toe-app",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tictactoe.app",
            "appName": "Tic Tac Toe",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Install Python Pillow
        run: |
          python3 -m pip install Pillow

      - name: Generate app icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGB", (1024, 1024), "#15172E")
          draw = ImageDraw.Draw(img)

          margin = 170
          end = 854
          cell = (end - margin) // 3
          line_width = 35

          for i in range(1, 3):
              x = margin + i * cell
              y = margin + i * cell

              draw.line(
                  [(x, margin), (x, end)],
                  fill="#6C7CFF",
                  width=line_width
              )

              draw.line(
                  [(margin, y), (end, y)],
                  fill="#6C7CFF",
                  width=line_width
              )

          offset = 50

          x1 = margin + offset
          y1 = margin + offset
          x2 = margin + cell - offset
          y2 = margin + cell - offset

          draw.line(
              [(x1, y1), (x2, y2)],
              fill="#FF5B57",
              width=45
          )

          draw.line(
              [(x2, y1), (x1, y2)],
              fill="#FF5B57",
              width=45
          )

          cx = margin + cell + cell // 2
          cy = margin + cell + cell // 2
          r = 95

          draw.ellipse(
              [cx-r, cy-r, cx+r, cy+r],
              outline="#38A9FF",
              width=45
          )

          img.save("icon.png")
          PY

      - name: Create Android icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          source = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(f"{path}/ic_launcher.png")
              icon.save(f"{path}/ic_launcher_round.png")
          PY

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" output/Tic-Tac-Toe.apk

          echo "APK created:"
          ls -lh output/Tic-Tac-Toe.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tic-Tac-Toe-APK
          path: output/Tic-Tac-Toe.apk
          retention-days: 30
