name: Build DOZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DOZ Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v7

      # ==========================================
      # 2. Node.js 24
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # ==========================================
      # 3. Java 21
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ==========================================
      # 4. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      # ==========================================
      # 5. Create Node project
      # ==========================================
      - name: Create package.json
        run: |
          npm init -y

      # ==========================================
      # 6. Install Capacitor
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # ==========================================
      # 7. Prepare HTML
      # ==========================================
      - name: Prepare Web App
        run: |
          rm -rf www
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          cp index.html www/index.html

      # ==========================================
      # 8. Capacitor configuration
      # ==========================================
      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.doz.game",
            "appName": "DOZ",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      # ==========================================
      # 9. Add Android
      # ==========================================
      - name: Add Android Platform
        run: |
          npx cap add android

      # ==========================================
      # 10. Sync
      # ==========================================
      - name: Sync Capacitor
        run: |
          npx cap sync android

      # ==========================================
      # 11. Generate DOZ Launcher Icon
      # ==========================================
      - name: Generate DOZ Launcher Icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # ------------------------------------------
          # Adaptive icon background
          # ------------------------------------------
          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#6C63FF" />
          </shape>
          EOF

          # ------------------------------------------
          # DOZ foreground logo
          # X + O inside a game board
          # ------------------------------------------
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- Dark game board -->
              <path
                  android:fillColor="#10101F"
                  android:pathData="M18,18 L90,18 L90,90 L18,90 Z" />

              <!-- Board lines -->
              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeAlpha="0.35"
                  android:strokeWidth="3"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M42,20 L42,88 M66,20 L66,88 M20,42 L88,42 M20,66 L88,66" />

              <!-- Red X -->
              <path
                  android:strokeColor="#FF4D5A"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M27,27 L51,51 M51,27 L27,51" />

              <!-- Blue O -->
              <path
                  android:strokeColor="#35A7FF"
                  android:strokeWidth="7"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M57,57 C57,49 63,43 71,43 C79,43 85,49 85,57 C85,65 79,71 71,71 C63,71 57,65 57,57 Z" />

              <!-- Small highlight -->
              <path
                  android:fillColor="#FFFFFF"
                  android:fillAlpha="0.75"
                  android:pathData="M25,22 C25,20 27,19 29,19 C31,19 32,20 32,22 C32,24 31,25 29,25 C27,25 25,24 25,22 Z" />

          </vector>
          EOF

          # ------------------------------------------
          # Adaptive icon
          # ------------------------------------------
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # ------------------------------------------
          # Round adaptive icon
          # ------------------------------------------
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      # ==========================================
      # 12. Generate legacy PNG launcher icons
      # ==========================================
      - name: Generate Legacy Launcher PNGs
        run: |
          python3 -m pip install --quiet pillow

          python3 <<'PY'
          from PIL import Image, ImageDraw

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():

              img = Image.new(
                  "RGBA",
                  (size, size),
                  (108, 99, 255, 255)
              )

              draw = ImageDraw.Draw(img)

              # Rounded game background
              margin = int(size * 0.08)

              draw.rounded_rectangle(
                  [
                      margin,
                      margin,
                      size - margin,
                      size - margin
                  ],
                  radius=int(size * 0.20),
                  fill=(16, 16, 31, 255)
              )

              # Board lines
              line = max(2, int(size * 0.035))

              draw.line(
                  [
                      int(size * 0.43),
                      int(size * 0.18),
                      int(size * 0.43),
                      int(size * 0.82)
                  ],
                  fill=(255,255,255,90),
                  width=line
              )

              draw.line(
                  [
                      int(size * 0.57),
                      int(size * 0.18),
                      int(size * 0.57),
                      int(size * 0.82)
                  ],
                  fill=(255,255,255,90),
                  width=line
              )

              draw.line(
                  [
                      int(size * 0.18),
                      int(size * 0.43),
                      int(size * 0.82),
                      int(size * 0.43)
                  ],
                  fill=(255,255,255,90),
                  width=line
              )

              draw.line(
                  [
                      int(size * 0.18),
                      int(size * 0.57),
                      int(size * 0.82),
                      int(size * 0.57)
                  ],
                  fill=(255,255,255,90),
                  width=line
              )

              # X
              w = max(2, int(size * 0.07))

              draw.line(
                  [
                      int(size * 0.28),
                      int(size * 0.28),
                      int(size * 0.47),
                      int(size * 0.47)
                  ],
                  fill=(255,77,90,255),
                  width=w
              )

              draw.line(
                  [
                      int(size * 0.47),
                      int(size * 0.28),
                      int(size * 0.28),
                      int(size * 0.47)
                  ],
                  fill=(255,77,90,255),
                  width=w
              )

              # O
              draw.ellipse(
                  [
                      int(size * 0.53),
                      int(size * 0.53),
                      int(size * 0.76),
                      int(size * 0.76)
                  ],
                  outline=(53,167,255,255),
                  width=w
              )

              img.save(
                  f"android/app/src/main/res/{folder}/ic_launcher.png",
                  "PNG"
              )

              img.save(
                  f"android/app/src/main/res/{folder}/ic_launcher_round.png",
                  "PNG"
              )

          print("DOZ launcher icons generated.")
          PY

      # ==========================================
      # 13. Set App Name and Launcher Icon
      # ==========================================
      - name: Configure Android App
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          text = re.sub(
              r'android:icon="[^"]+"',
              'android:icon="@mipmap/ic_launcher"',
              text
          )

          text = re.sub(
              r'android:roundIcon="[^"]+"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text
          )

          manifest.write_text(text)

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if strings.exists():
              text = strings.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">DOZ</string>',
                  text
              )

              strings.write_text(text)

          print("App name: DOZ")
          print("Launcher icon: DOZ")
          PY

      # ==========================================
      # 14. Configure Android SDK / Version
      # ==========================================
      - name: Configure Android Build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle was not found.")

          text = path.read_text()

          # compile SDK
          text = re.sub(
              r'compileSdk(?:Version)?\s+\S+',
              'compileSdkVersion 36',
              text,
              count=1
          )

          # target SDK
          text = re.sub(
              r'targetSdk(?:Version)?\s+\S+',
              'targetSdkVersion 36',
              text,
              count=1
          )

          # If targetSdk wasn't present
          if not re.search(r'targetSdk(?:Version)?\s+36', text):
              text = text.replace(
                  'defaultConfig {',
                  'defaultConfig {\n        targetSdkVersion 36',
                  1
              )

          path.write_text(text)
          PY

      # ==========================================
      # 15. Generate increasing versionCode
      # ==========================================
      - name: Set App Version
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "DOZ versionCode: $VERSION_CODE"

      - name: Apply App Version
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("android/app/build.gradle")
          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]

          if re.search(r'versionCode\s+\d+', text):
              text = re.sub(
                  r'versionCode\s+\d+',
                  f'versionCode {version_code}',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  'defaultConfig {',
                  f'defaultConfig {{\n'
                  f'        versionCode {version_code}',
                  1
              )

          if re.search(r'versionName\s+"[^"]+"', text):
              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.0"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  f'versionCode {version_code}',
                  f'versionCode {version_code}\n'
                  f'        versionName "1.0"',
                  1
              )

          path.write_text(text)
          PY

      # ==========================================
      # 16. Restore fixed signing key
      # ==========================================
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

          test -s android/release.keystore

          echo "Release keystore restored."

      # ==========================================
      # 17. Configure Signing
      # ==========================================
      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=doz
          keyPassword=$KEYSTORE_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "keystorePropertiesFile" not in text:
              signing_code = r'''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

              text = signing_code + "\n" + text

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }""",
                  1
              )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
              release {
                  signingConfig signingConfigs.release
              }""",
              1
          )

          path.write_text(text)
          PY

      # ==========================================
      # 18. Build Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      # ==========================================
      # 19. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      # ==========================================
      # 20. Prepare final APK
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            output/DOZ.apk

          ls -lh output/DOZ.apk

      # ==========================================
      # 21. Upload APK
      # ==========================================
      - name: Upload DOZ APK
        uses: actions/upload-artifact@v4
        with:
          name: DOZ-Android-Release
          path: output/DOZ.apk
          if-no-files-found: error

      # ==========================================
      # 22. Cleanup signing files
      # ==========================================
      - name: Cleanup Signing Files
        if: always()
        run: |
          rm -f android/release.keystore
          rm -f android/keystore.properties
