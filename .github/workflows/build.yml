name: Build DOZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DOZ Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web App
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.doz.game",
            "appName": "DOZ",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      # ==========================================
      # DOZ APP ICON
      # ==========================================
      - name: Generate DOZ Icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cat > android/app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#6C63FF"/>
          </shape>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#10101F"
                  android:pathData="M18,18 L90,18 L90,90 L18,90 Z"/>

              <path
                  android:strokeColor="#FFFFFF"
                  android:strokeAlpha="0.35"
                  android:strokeWidth="3"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M42,20 L42,88 M66,20 L66,88 M20,42 L88,42 M20,66 L88,66"/>

              <path
                  android:strokeColor="#FF4D5A"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M27,27 L51,51 M51,27 L27,51"/>

              <path
                  android:strokeColor="#35A7FF"
                  android:strokeWidth="7"
                  android:fillColor="@android:color/transparent"
                  android:pathData="M57,57 C57,49 63,43 71,43 C79,43 85,49 85,57 C85,65 79,71 71,71 C63,71 57,65 57,57 Z"/>
          </vector>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Configure Android App
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]+"',
                  'android:icon="@mipmap/ic_launcher"',
                  text
              )
          else:
              text = text.replace(
                  '<application',
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]+"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  text
              )

          manifest.write_text(text)

          strings = Path("android/app/src/main/res/values/strings.xml")

          if strings.exists():
              text = strings.read_text()

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">DOZ</string>',
                  text
              )

              strings.write_text(text)
          PY

      # ==========================================
      # STABLE APP ID
      # ==========================================
      - name: Configure Application ID
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.doz.game"',
              text,
              count=1
          )

          path.write_text(text)
          PY

      # ==========================================
      # INCREASING VERSION CODE
      # ==========================================
      - name: Set Version
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "DOZ versionCode: $VERSION_CODE"

      - name: Apply Version
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("android/app/build.gradle")
          text = path.read_text()

          version_code = os.environ["VERSION_CODE"]

          if re.search(r'versionCode\s+\d+', text):
              text = re.sub(
                  r'versionCode\s+\d+',
                  f'versionCode {version_code}',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  "defaultConfig {",
                  f"defaultConfig {{\n"
                  f"        versionCode {version_code}",
                  1
              )

          if re.search(r'versionName\s+"[^"]+"', text):
              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  'versionName "1.0"',
                  text,
                  count=1
              )
          else:
              text = text.replace(
                  f"versionCode {version_code}",
                  f'versionCode {version_code}\n'
                  f'        versionName "1.0"',
                  1
              )

          path.write_text(text)
          PY

      # ==========================================
      # RESTORE KEYSTORE
      # ==========================================
      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "ERROR: Keystore file is empty."
            exit 1
          fi

          echo "Keystore restored successfully."

      # ==========================================
      # SIGNING
      # ==========================================
      - name: Configure Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=doz
          keyPassword=$KEYSTORE_PASSWORD
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          signing_loader = '''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = signing_loader + "\n" + text

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          '''

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "buildTypes {",
                  '''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              ''',
                  1
              )

          path.write_text(text)
          PY

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      # ==========================================
      # VERIFY APK
      # ==========================================
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # ==========================================
      # PREPARE APK
      # ==========================================
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/DOZ.apk

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload DOZ APK
        uses: actions/upload-artifact@v4
        with:
          name: DOZ-Android-Release
          path: output/DOZ.apk
          if-no-files-found: error

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup Signing Files
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/keystore.properties
