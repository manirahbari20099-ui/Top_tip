name: Build DOZ Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Checkout
      # =========================================

      - name: Checkout
        uses: actions/checkout@v5


      # =========================================
      # Node.js
      # =========================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24


      # =========================================
      # Java
      # =========================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # =========================================
      # Android SDK
      # =========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================
      # Prepare game
      # =========================================

      - name: Prepare game
        run: |
          test -f index.html

          rm -rf www
          mkdir -p www

          cp index.html www/index.html


      # =========================================
      # package.json
      # =========================================

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "doz",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF


      # =========================================
      # Install Capacitor
      # =========================================

      - name: Install dependencies
        run: |
          npm install


      # =========================================
      # Capacitor configuration
      # =========================================

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.doz.game",
            "appName": "DOZ",
            "webDir": "www"
          }
          EOF


      # =========================================
      # Create Android project
      # =========================================

      - name: Add Android
        run: |
          npx cap add android


      - name: Sync Android
        run: |
          npx cap sync android


      # =========================================
      # Version
      # =========================================

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |

          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"


      # =========================================
      # Load SAME KEYSTORE
      # =========================================

      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > DOZ.keystore

          test -s DOZ.keystore

          cp DOZ.keystore android/app/DOZ.keystore

          echo "Keystore loaded successfully."


      # =========================================
      # Configure signing properties
      # =========================================

      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          cat >> android/gradle.properties <<EOF

          DOZ_KEYSTORE_FILE=DOZ.keystore
          DOZ_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          DOZ_KEY_ALIAS=doz
          DOZ_KEY_PASSWORD=${KEYSTORE_PASSWORD}

          EOF


      # =========================================
      # Configure Android Gradle
      # =========================================

      - name: Configure Android Gradle
        run: |

          python3 - <<'PY'

          import re
          import os

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()


          # -----------------------------------------
          # Application ID
          # -----------------------------------------

          text = re.sub(
              r'applicationId\s+"[^"]+"',
              'applicationId "com.doz.game"',
              text,
              count=1
          )


          # -----------------------------------------
          # Compile SDK
          # -----------------------------------------

          text = re.sub(
              r'compileSdk\s+[^\n]+',
              'compileSdk 35',
              text,
              count=1
          )


          # -----------------------------------------
          # Version Code
          # -----------------------------------------

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode ' + os.environ["VERSION_CODE"],
              text,
              count=1
          )


          # -----------------------------------------
          # Version Name
          # -----------------------------------------

          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName "' + os.environ["VERSION_NAME"] + '"',
              text,
              count=1
          )


          # -----------------------------------------
          # Remove existing signingConfigs
          # -----------------------------------------

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)',
              '',
              text,
              flags=re.S
          )


          # -----------------------------------------
          # Add signingConfigs
          # -----------------------------------------

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(DOZ_KEYSTORE_FILE)
                      storePassword DOZ_KEYSTORE_PASSWORD
                      keyAlias DOZ_KEY_ALIAS
                      keyPassword DOZ_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''


          if "signingConfigs {" not in text:

              text = text.replace(
                  "    buildTypes {",
                  signing_block + "    buildTypes {",
                  1
              )


          # -----------------------------------------
          # Add release signing
          # -----------------------------------------

          pattern = (
              r'(buildTypes\s*\{\s*'
              r'release\s*\{)'
          )

          replacement = (
              r'\1\n'
              r'            signingConfig signingConfigs.release'
          )

          if "signingConfig signingConfigs.release" not in text:

              text = re.sub(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S
              )


          # -----------------------------------------
          # Disable minification
          # -----------------------------------------

          if "minifyEnabled" in text:

              text = re.sub(
                  r'minifyEnabled\s+\w+',
                  'minifyEnabled false',
                  text,
                  count=1
              )


          with open(path, "w", encoding="utf-8") as f:
              f.write(text)


          print("DOZ Android Gradle configured successfully.")

          PY


      # =========================================
      # Show Gradle configuration
      # =========================================

      - name: Show Gradle configuration
        run: |

          echo "=========================================="
          echo "FINAL DOZ BUILD.GRADLE"
          echo "=========================================="

          cat android/app/build.gradle


      # =========================================
      # Install Pillow
      # =========================================

      - name: Install Pillow
        run: |
          python3 -m pip install pillow


      # =========================================
      # Create DOZ Icon PNG
      # =========================================

      - name: Create DOZ icon
        run: |

          cat > create_doz_icon.py <<'PY'

          from PIL import Image, ImageDraw

          S = 1024

          # -----------------------------------------
          # Canvas
          # -----------------------------------------

          img = Image.new(
              "RGBA",
              (S, S),
              (108, 99, 255, 255)
          )

          d = ImageDraw.Draw(img)


          # -----------------------------------------
          # Rounded background
          # -----------------------------------------

          d.rounded_rectangle(
              (25, 25, 999, 999),
              radius=210,
              fill=(108, 99, 255, 255)
          )


          # -----------------------------------------
          # Dark game board
          # -----------------------------------------

          d.rounded_rectangle(
              (145, 145, 879, 879),
              radius=95,
              fill=(18, 18, 35, 255)
          )


          # -----------------------------------------
          # Board lines
          # -----------------------------------------

          line_color = (255, 255, 255, 180)

          d.rounded_rectangle(
              (180, 180, 844, 844),
              radius=60,
              outline=line_color,
              width=8
          )


          d.line(
              (401, 190, 401, 834),
              fill=line_color,
              width=12
          )

          d.line(
              (623, 190, 623, 834),
              fill=line_color,
              width=12
          )

          d.line(
              (190, 401, 834, 401),
              fill=line_color,
              width=12
          )

          d.line(
              (190, 623, 834, 623),
              fill=line_color,
              width=12
          )


          # -----------------------------------------
          # X symbol
          # -----------------------------------------

          x_color = (255, 77, 90, 255)

          d.line(
              (235, 235, 350, 350),
              fill=x_color,
              width=38
          )

          d.line(
              (350, 235, 235, 350),
              fill=x_color,
              width=38
          )


          # -----------------------------------------
          # O symbol
          # -----------------------------------------

          o_color = (53, 167, 255, 255)

          d.ellipse(
              (465, 465, 580, 580),
              outline=o_color,
              width=38
          )


          # -----------------------------------------
          # Big central O
          # -----------------------------------------

          d.ellipse(
              (665, 665, 810, 810),
              outline=(53, 167, 255, 255),
              width=42
          )


          # -----------------------------------------
          # Small X
          # -----------------------------------------

          d.line(
              (685, 265, 795, 375),
              fill=(255, 77, 90, 255),
              width=34
          )

          d.line(
              (795, 265, 685, 375),
              fill=(255, 77, 90, 255),
              width=34
          )


          # -----------------------------------------
          # Highlight
          # -----------------------------------------

          d.ellipse(
              (215, 190, 280, 255),
              fill=(255, 255, 255, 80)
          )


          # -----------------------------------------
          # Save PNG
          # -----------------------------------------

          img.save(
              "DOZ-icon.png",
              "PNG"
          )

          print("DOZ-icon.png created successfully.")

          PY


          python3 create_doz_icon.py

          test -s DOZ-icon.png


      # =========================================
      # Generate Android icon sizes
      # =========================================

      - name: Generate Android icons
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os


          source = Image.open(
              "DOZ-icon.png"
          ).convert("RGBA")


          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }


          for density, size in sizes.items():

              folder = (
                  "android/app/src/main/res/mipmap-"
                  + density
              )

              os.makedirs(
                  folder,
                  exist_ok=True
              )


              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )


              icon.save(
                  folder + "/ic_launcher.png"
              )

              icon.save(
                  folder + "/ic_launcher_round.png"
              )


          print("DOZ Android icons generated successfully.")

          PY


      # =========================================
      # Remove adaptive icon defaults
      # =========================================

      - name: Remove adaptive icon defaults
        run: |

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      # =========================================
      # Configure App Icon and Name
      # =========================================

      - name: Configure App Icon
        run: |

          python3 - <<'PY'

          from pathlib import Path
          import re


          # -----------------------------------------
          # Android Manifest
          # -----------------------------------------

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )


          if "android:icon=" in text:

              text = re.sub(
                  r'android:icon="[^"]+"',
                  'android:icon="@mipmap/ic_launcher"',
                  text
              )

          else:

              text = text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )


          if "android:roundIcon=" in text:

              text = re.sub(
                  r'android:roundIcon="[^"]+"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  text
              )


          manifest.write_text(
              text,
              encoding="utf-8"
          )


          # -----------------------------------------
          # App name
          # -----------------------------------------

          strings = Path(
              "android/app/src/main/res/values/strings.xml"
          )


          if strings.exists():

              text = strings.read_text(
                  encoding="utf-8"
              )

              text = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">DOZ</string>',
                  text
              )

              strings.write_text(
                  text,
                  encoding="utf-8"
              )


          print("DOZ icon and app name configured.")

          PY


      # =========================================
      # Verify icon files
      # =========================================

      - name: Verify DOZ icon
        run: |

          echo "=========================================="
          echo "DOZ ICON FILES"
          echo "=========================================="

          ls -lh DOZ-icon.png

          echo ""
          echo "Android icons:"

          find android/app/src/main/res \
            -name "ic_launcher.png" \
            -o -name "ic_launcher_round.png" \
            | sort


      # =========================================
      # Verify configuration
      # =========================================

      - name: Verify configuration
        run: |

          echo "=========================================="
          echo "DOZ CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "APPLICATION ID:"
          grep "applicationId" android/app/build.gradle

          echo ""
          echo "VERSION:"
          grep "versionCode" android/app/build.gradle
          grep "versionName" android/app/build.gradle

          echo ""
          echo "COMPILE SDK:"
          grep "compileSdk" android/app/build.gradle

          echo ""
          echo "APP NAME:"
          grep "app_name" android/app/src/main/res/values/strings.xml


      # =========================================
      # Build Release APK
      # =========================================

      - name: Build Release APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew clean

          ./gradlew assembleRelease --no-daemon


      # =========================================
      # Verify APK
      # =========================================

      - name: Verify APK
        run: |

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "=========================================="
          echo "DOZ APK CREATED"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # =========================================
      # Build AAB
      # =========================================

      - name: Build Release AAB
        working-directory: android
        run: |

          ./gradlew bundleRelease --no-daemon


      # =========================================
      # Prepare release files
      # =========================================

      - name: Prepare release
        run: |

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/DOZ.apk

          cp \
            android/app/build/outputs/bundle/release/app-release.aab \
            release/DOZ.aab

          cp \
            DOZ-icon.png \
            release/DOZ-icon.png


      # =========================================
      # Upload APK + AAB + Icon
      # =========================================

      - name: Upload DOZ Release
        uses: actions/upload-artifact@v6
        with:
          name: DOZ-Android-Release
          path: release/
          if-no-files-found: error


      # =========================================
      # Cleanup
      # =========================================

      - name: Cleanup
        if: always()
        run: |

          rm -f DOZ.keystore
          rm -f android/app/DOZ.keystore
          rm -f android/keystore.properties
